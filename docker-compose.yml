services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mificha
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mificha_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mificha -d mificha_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: mificha
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mificha_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: