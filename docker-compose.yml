version: "3.9"

services:
  # Servicio de API FastAPI
  mificha-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mificha-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://mificha_user:mificha_password@mificha-db:5432/mificha_db
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      mificha-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/__pycache__
    networks:
      - mificha-network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio de Base de Datos PostgreSQL
  mificha-db:
    image: postgres:15-alpine
    container_name: mificha-db
    environment:
      POSTGRES_USER: mificha_user
      POSTGRES_PASSWORD: mificha_password
      POSTGRES_DB: mificha_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_ES.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - mificha-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - mificha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mificha_user -d mificha_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Servicio pgAdmin para gestión de BD (opcional, solo desarrollo)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mificha-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mificha.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - mificha-network
    restart: unless-stopped
    depends_on:
      - mificha-db
    profiles:
      - dev

volumes:
  mificha-db-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  mificha-network:
    driver: bridge