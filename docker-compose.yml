version: "3.9"

services:
  # FastAPI Backend Application
  mificha-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mificha-api
    image: mificha-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@mificha-db:5432/${DATABASE_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    depends_on:
      mificha-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/__pycache__
    networks:
      - mificha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Production-like API service (without hot reload)
  mificha-api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mificha-api-prod
    image: mificha-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@mificha-db:5432/${DATABASE_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    depends_on:
      mificha-db:
        condition: service_healthy
    networks:
      - mificha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod

  # PostgreSQL Database
  mificha-db:
    image: postgres:15-alpine
    container_name: mificha-db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_ES.UTF-8"
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - mificha-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - mificha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # pgAdmin for Database Management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mificha-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mificha.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - mificha-network
    restart: unless-stopped
    depends_on:
      - mificha-db
    profiles:
      - dev

volumes:
  mificha-db-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  mificha-network:
    driver: bridge
